name: Browser acceptance and screenshots
on:
  pull_request:
    paths:
      - "playground/**"
      - "tests/browser-acceptance.mjs"
      - ".github/workflows/browser-acceptance.yml"
  push:
    branches:
      - "feat/interactive-gpu-kitchen-playground"
    paths:
      - "playground/**"
      - "tests/browser-acceptance.mjs"
      - ".github/workflows/browser-acceptance.yml"
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static site and verify
        run: |
          mkdir -p browser-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gpu-uncooked-http.log 2>&1 &
          node tests/browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-uncooked-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
